# Auto-deploy: every push to main is pulled onto the EC2 instance and the API
# is reloaded under PM2 (scripts/deploy.sh). A failed deploy fails this job
# and leaves the previous version running.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST      public IP or DNS of the instance
#   EC2_USER      ssh user (ubuntu / ec2-user)
#   EC2_SSH_KEY   private key (PEM) that can ssh in as EC2_USER
#   EC2_APP_DIR   absolute path of the checked-out repo on the box
#   EC2_PORT      (optional) ssh port, default 22
name: Deploy API to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Leave EC2_PORT unset for the default 22. A non-numeric value here
          # made every deploy since 2026-08-23 fail before connecting.
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -1)/bin:$PATH:/usr/local/bin"
            export APP_DIR="${{ secrets.EC2_APP_DIR }}"
            cd "$APP_DIR"
            # scripts/deploy.sh is versioned; if an old checkout lacks it, pull first.
            [ -f scripts/deploy.sh ] || { git fetch --prune origin && git reset --hard origin/main; }
            bash scripts/deploy.sh
